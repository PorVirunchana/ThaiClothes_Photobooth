<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thai Photobooth – Your Photo</title>
<link rel="stylesheet" href="style.css">
<style>
  .result-strip-container {
    display: flex; justify-content: center;
    margin: 0 auto 22px;
  }
  #result-canvas {
    max-width: 260px; width: 100%;
    border-radius: 12px;
    border: 2px solid rgba(201,145,61,0.5);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 30px rgba(201,145,61,0.25);
    animation: fadeUp 0.7s ease;
  }

  .result-actions {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }

  /* ── Music ── */
  .music-indicator {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.8rem; color: rgba(240,201,107,0.75);
    padding: 8px 18px;
    background: rgba(201,145,61,0.08);
    border: 1px solid rgba(201,145,61,0.2);
    border-radius: 20px; cursor: pointer;
    transition: background 0.2s;
  }
  .music-indicator:hover { background: rgba(201,145,61,0.15); }
  .music-bars { display: flex; gap: 2px; align-items: flex-end; height: 16px; }
  .music-bar {
    width: 3px; background: var(--gold); border-radius: 1px;
    animation: bounce 0.8s ease-in-out infinite;
  }
  .music-bar:nth-child(1) { height: 6px;  animation-delay: 0s; }
  .music-bar:nth-child(2) { height: 14px; animation-delay: 0.15s; }
  .music-bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }
  .music-bar:nth-child(4) { height: 7px;  animation-delay: 0.45s; }
  @keyframes bounce {
    0%, 100% { transform: scaleY(0.4); }
    50%       { transform: scaleY(1); }
  }
  .music-indicator.muted .music-bars { opacity: 0.3; }
  .music-indicator.muted .music-bar  { animation: none; transform: scaleY(0.4); }
</style>
</head>
<body>

<div class="thai-bg"></div>

<div class="loading-screen" id="loading">
  <div class="loading-lotus">🪷</div>
  <div class="loading-text">Building your photo…</div>
</div>

<!-- ══ Main page ══ -->
<div class="page">
  <div class="header">
    <span class="lotus-icon">🌸</span>
    <h1>Your Photo</h1>
    <div class="gold-line"></div>
    <p class="subtitle">ภาพถ่ายของคุณ</p>
  </div>

  <div class="steps-bar">
    <div class="step-dot done">✓</div>
    <div class="step-line done"></div>
    <div class="step-dot done">✓</div>
    <div class="step-line done"></div>
    <div class="step-dot active">3</div>
  </div>

  <div class="panel" style="max-width:420px">
    <div class="result-strip-container">
      <canvas id="result-canvas"></canvas>
    </div>

    <div class="result-actions">
      <div class="music-indicator" id="music-indicator" onclick="toggleMusic()">
        <div class="music-bars">
          <div class="music-bar"></div><div class="music-bar"></div>
          <div class="music-bar"></div><div class="music-bar"></div>
        </div>
        <span id="music-label">ออเจ้าเอย · Playing</span>
      </div>

      <button class="btn-gold" id="download-btn" onclick="directDownload()">
        ⬇ Download · บันทึก
      </button>
      <button class="btn-outline" onclick="restart()">↺ Start Over · เริ่มใหม่</button>
    </div>
  </div>
</div>

<audio id="bg-music" loop>
  <source src="orjao.mp3" type="audio/mpeg">
</audio>

<script>
// ── Data ──────────────────────────────────────────────────────────
const frameData      = JSON.parse(sessionStorage.getItem('selectedFrame')  || 'null');
const capturedPhotos = JSON.parse(sessionStorage.getItem('capturedPhotos') || '[]');
if (!capturedPhotos.length) { window.location.href = 'index.html'; }

let isReady   = false;
let qrTimer   = null;
let photoDataUrl = null;   // cached final image data URL for QR + download

// ── Build photo strip ─────────────────────────────────────────────
function buildPhotoStrip() {
  const canvas = document.getElementById('result-canvas');
  const ctx    = canvas.getContext('2d');
  const slots  = (frameData && frameData.slots && frameData.slots.length >= 4)
                  ? frameData.slots.slice(0, 4) : null;
  const W = 400;

  if (frameData && frameData.src && slots) {
    const frameImg = new Image();
    frameImg.onload = () => {
      const scale = W / frameImg.naturalWidth;
      const H = Math.round(frameImg.naturalHeight * scale);
      canvas.width = W; canvas.height = H;
      ctx.fillStyle = '#1A0800';
      ctx.fillRect(0, 0, W, H);

      let loaded = 0;
      capturedPhotos.forEach((src, i) => {
        if (!slots[i]) { loaded++; return; }
        const img = new Image();
        const done = () => {
          loaded++;
          if (loaded === capturedPhotos.length) {
            ctx.drawImage(frameImg, 0, 0, W, H);
            finishStrip(canvas);
          }
        };
        img.onload = () => {
          const s = slots[i];
          const sx = s.x * W, sy = s.y * H, sw = s.w * W, sh = s.h * H;
          ctx.save();
          ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip();
          const sc = Math.max(sw / img.width, sh / img.height);
          ctx.drawImage(img, sx + (sw - img.width * sc) / 2, sy + (sh - img.height * sc) / 2, img.width * sc, img.height * sc);
          ctx.restore();
          done();
        };
        img.onerror = done;
        img.src = src;
      });
    };
    frameImg.onerror = () => buildFallbackStrip(W);
    frameImg.src = frameData.src;
  } else {
    buildFallbackStrip(W);
  }
}

function buildFallbackStrip(W) {
  const canvas = document.getElementById('result-canvas');
  const ctx    = canvas.getContext('2d');
  const PAD = 18, GAP = 10, N = capturedPhotos.length;
  const PHOTO_H = 220;
  const H = PAD + (PHOTO_H + GAP) * N - GAP + PAD + 40;
  canvas.width = W; canvas.height = H;
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#3D1800'); bg.addColorStop(1,'#1A0800');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#C9913D'; ctx.lineWidth=3; ctx.strokeRect(5,5,W-10,H-10);

  let loaded = 0;
  capturedPhotos.forEach((src, i) => {
    const img = new Image();
    img.onload = () => {
      const y = PAD + i*(PHOTO_H+GAP), x = PAD, pw = W-PAD*2;
      ctx.fillStyle='#fff'; rr(ctx,x,y,pw,PHOTO_H,5); ctx.fill();
      ctx.save(); rr(ctx,x,y,pw,PHOTO_H,5); ctx.clip();
      const sc = Math.max(pw/img.width, PHOTO_H/img.height);
      ctx.drawImage(img, x+(pw-img.width*sc)/2, y+(PHOTO_H-img.height*sc)/2, img.width*sc, img.height*sc);
      ctx.restore();
      ctx.strokeStyle='rgba(201,145,61,0.4)'; ctx.lineWidth=1.5; rr(ctx,x,y,pw,PHOTO_H,5); ctx.stroke();
      loaded++;
      if (loaded === capturedPhotos.length) finishStrip(canvas);
    };
    img.onerror = () => { loaded++; if (loaded===capturedPhotos.length) finishStrip(canvas); };
    img.src = src;
  });
}

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function finishStrip(canvas) {
  // Cache the final image as a data URL
  try {
    photoDataUrl = canvas.toDataURL('image/jpeg', 0.93);
  } catch (e) {
    console.warn('Canvas tainted - download via server required');
    // Will need to use the server workaround
    photoDataUrl = null;
  }
  isReady = true;
  hideLoading();
}

// Direct download (full quality)
async function directDownload() {
  const canvas = document.getElementById('result-canvas');
  
  // Try to get data URL directly from canvas
  let dataUrl = null;
  try {
    dataUrl = canvas.toDataURL('image/jpeg', 0.93);
  } catch (e) {
    console.error('Canvas export failed:', e);
  }
  
  // Fallback to cached version
  if (!dataUrl && photoDataUrl) {
    dataUrl = photoDataUrl;
  }
  
  if (!dataUrl) {
    alert('Cannot download: browser security blocked. Try right-clicking the photo → "Save Image"');
    return;
  }

  // Try server-side download for better compatibility
  try {
    const response = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageData: dataUrl })
    });
    
    if (response.ok) {
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'thai-photobooth.jpg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      return;
    }
  } catch (e) {
    console.warn('Server download failed, trying client-side:', e);
  }
  
  // Fallback: client-side download
  const link = document.createElement('a');
  link.href     = dataUrl;
  link.download = 'thai-photobooth.jpg';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// ── Music ─────────────────────────────────────────────────────────
let musicMuted = false;

function playMusic() {
  const audio = document.getElementById('bg-music');
  audio.volume = 0.6;
  audio.play().catch(() => {
    document.getElementById('music-label').textContent = 'Tap to play music';
    document.getElementById('music-indicator').classList.add('muted');
    musicMuted = true;
  });
}

function toggleMusic() {
  const audio     = document.getElementById('bg-music');
  const indicator = document.getElementById('music-indicator');
  const label     = document.getElementById('music-label');
  if (musicMuted) {
    audio.play();
    label.textContent = 'ออเจ้าเอย · Playing';
    indicator.classList.remove('muted');
    musicMuted = false;
  } else {
    audio.pause();
    label.textContent = 'ออเจ้าเอย · Paused';
    indicator.classList.add('muted');
    musicMuted = true;
  }
}

// ── Misc ──────────────────────────────────────────────────────────
function restart() {
  clearInterval(countdownInterval);
  sessionStorage.clear();
  document.getElementById('bg-music').pause();
  window.location.href = 'index.html';
}

function hideLoading() {
  const l = document.getElementById('loading');
  l.style.opacity = '0';
  setTimeout(() => l.style.display = 'none', 400);
}

// ── Init ──────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  buildPhotoStrip();
  playMusic();

  // Safety net: force ready after 12s if image building stalls
  setTimeout(() => {
    if (!isReady) { isReady = true; hideLoading(); }
  }, 12000);
});
</script>
</body>
</html>
